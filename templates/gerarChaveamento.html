{% include 'head.html' %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Chaveamento - Jogos Internos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chaveamento.css') }}">
</head>

<main>
{% if session['nivel'] == 'Administrador' %}
<div class="container">
    <h1>Gerar Chaveamento</h1>

    <form id="chaveamento-form">
        <div class="form-group">
            <label for="esporte">Esporte:</label>
            <select id="esporte" name="esporte" required>
                <option value="">Selecione o Esporte</option>
                {% for esporte in esportes %}
                <option value="{{ esporte.pk_esporte }}">{{ esporte.pk_esporte }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="classificacao">Classificação (Gênero):</label>
            <select id="classificacao" name="classificacao" required>
                <option value="">Selecione a Classificação</option>
                {% for classificacao in classificacoes %}
                <option value="{{ classificacao.pk_genero }}">{{ classificacao.pk_genero }}</option>
                {% endfor %}
            </select>
        </div>

        <section id="equipes-preview" class="equipes-preview" hidden>
            <div class="equipes-preview-header">
                <div>
                    <h2>Equipes que participarão</h2>
                    <p id="equipes-preview-resumo">Selecione os filtros para visualizar as equipes.</p>
                </div>
                <span id="equipes-preview-total" class="equipes-count">0</span>
            </div>
            <div id="equipes-preview-lista" class="equipes-preview-lista"></div>
        </section>

        <div id="equipes-loading" class="equipes-loading" hidden>
            Carregando equipes...
        </div>

        <div id="equipes-error" class="equipes-error" hidden></div>

        <button type="submit" class="btn-gerar">
            Gerar e Salvar Chaveamento
        </button>
    </form>

    <div id="status-message"></div>
</div>
{% endif %}
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("chaveamento-form");
    const esporteSelect = document.getElementById("esporte");
    const classificacaoSelect = document.getElementById("classificacao");
    const preview = document.getElementById("equipes-preview");
    const lista = document.getElementById("equipes-preview-lista");
    const resumo = document.getElementById("equipes-preview-resumo");
    const total = document.getElementById("equipes-preview-total");
    const loading = document.getElementById("equipes-loading");
    const errorBox = document.getElementById("equipes-error");
    const statusDiv = document.getElementById("status-message");

    if (!form) return;

    function limparPreview() {
        preview.hidden = true;
        loading.hidden = true;
        errorBox.hidden = true;
        lista.innerHTML = "";
        total.textContent = "0";
        resumo.textContent = "Selecione os filtros para visualizar as equipes.";
    }

    function carregarEquipes() {
        const esporte = esporteSelect.value;
        const classificacao = classificacaoSelect.value;

        limparPreview();

        if (!esporte || !classificacao) return;

        loading.hidden = false;

        fetch(
            `/chaveamento/equipes?esporte=${encodeURIComponent(esporte)}&classificacao=${encodeURIComponent(classificacao)}`
        )
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            loading.hidden = true;

            if (!ok || data.status !== "sucesso") {
                throw new Error(data.mensagem || "Não foi possível carregar as equipes.");
            }

            const equipes = data.equipes || [];
            preview.hidden = false;
            total.textContent = equipes.length;
            resumo.textContent = equipes.length
                ? `${equipes.length} equipe(s) encontrada(s) para os filtros selecionados.`
                : "Nenhuma equipe cadastrada para os filtros selecionados.";

            if (!equipes.length) {
                lista.innerHTML = `<div class="equipe-vazia">Nenhuma equipe encontrada.</div>`;
                return;
            }

            equipes.forEach((equipe, index) => {
                const card = document.createElement("article");
                card.className = "equipe-preview-card";
                card.innerHTML = `
                    <div class="equipe-preview-numero">${index + 1}</div>
                    <div class="equipe-preview-info">
                        <strong>${equipe.nome_equipe || `Equipe ${equipe.pk_equipe}`}</strong>
                        <span>Turma: ${equipe.turma || "-"}</span>
                    </div>
                `;
                lista.appendChild(card);
            });
        })
        .catch(error => {
            loading.hidden = true;
            errorBox.hidden = false;
            errorBox.textContent = error.message;
        });
    }

    esporteSelect.addEventListener("change", carregarEquipes);
    classificacaoSelect.addEventListener("change", carregarEquipes);

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const esporte = esporteSelect.value;
        const classificacao = classificacaoSelect.value;

        if (!esporte || !classificacao) {
            statusDiv.style.display = "block";
            statusDiv.className = "error";
            statusDiv.textContent = "Selecione o esporte e a classificação.";
            return;
        }

        const confirmou = window.confirm(
            `Deseja realmente gerar o chaveamento de ${esporte} (${classificacao})?\n\n` +
            "As partidas serão geradas e salvas no sistema."
        );

        if (!confirmou) return;

        statusDiv.style.display = "block";
        statusDiv.className = "";
        statusDiv.textContent = "Gerando chaveamento...";

        fetch("/chaveamento/gerar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                esporte,
                classificacao
            })
        })
        .then(response => response.json().then(data => ({ ok: response.ok, data })))
        .then(({ ok, data }) => {
            if (!ok) {
                throw new Error(data.mensagem || `Erro do servidor: Status desconhecido`);
            }

            if (data.status === "redirecionar") {
                window.location.href = data.url;
                return;
            }

            if (data.status === "sucesso") {
                statusDiv.className = "success";
                statusDiv.textContent =
                    `${data.mensagem} Total de partidas da 1ª rodada salvas: ${data.total_partidas}.`;
            } else {
                statusDiv.className = "error";
                statusDiv.textContent = data.mensagem || "Falha ao gerar o chaveamento.";
            }
        })
        .catch(error => {
            console.error("Erro na requisição:", error);
            statusDiv.className = "error";
            statusDiv.textContent = `Falha ao gerar o chaveamento: ${error.message}`;
        });
    });
});
</script>

{% include 'footer.html' %}
